<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body.plain{background:#f4f5f7;color:#1f2430}
body.party{background:radial-gradient(ellipse at top,#45145e 0%,#1d0b33 55%,#0b0418 100%);color:#fff;overflow:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;display:none}
body.party #fx{display:block}
.screen{display:none}.screen.on{display:block}

/* ===== page 1: plain form ===== */
#form.on{display:flex;min-height:100%;min-height:100dvh;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:#fff;border-radius:14px;padding:24px 20px;box-shadow:0 4px 24px #0000000f;border:1px solid #e6e8ec}
.card h1{font-size:22px;font-weight:700;margin-bottom:16px;text-align:center}
.card textarea{width:100%;min-height:170px;font:inherit;font-size:16px;line-height:1.45;padding:12px;border:1px solid #cfd4dc;border-radius:10px;resize:vertical;color:#1f2430;background:#fafbfc}
.card textarea:focus{outline:none;border-color:#4a5568;box-shadow:0 0 0 3px #4a556822}
.card button{width:100%;margin-top:14px;border:0;border-radius:10px;background:#2d3748;color:#fff;font:inherit;font-weight:600;font-size:16px;padding:13px;cursor:pointer}
.card button:active{background:#1a202c}
.card button:disabled{opacity:.7}
.err{display:none;color:#c53030;font-size:14px;margin-top:8px}.err.on{display:block}
.card textarea.bad{border-color:#c53030;box-shadow:0 0 0 3px #c5303022}

/* ===== page 2: scene ===== */
#scene{position:relative;z-index:2;height:100%;height:100dvh;max-width:460px;margin:0 auto;font-family:'Baloo 2',system-ui,sans-serif}
#scene.on{display:flex;flex-direction:column}
#sv{flex:1;min-height:0;width:100%;display:block}
.ph{font:700 12px Arial,sans-serif;fill:#fff;letter-spacing:1px}
.pt{font:11px Arial,sans-serif;fill:#555}
.pb{font:12px Arial,sans-serif;fill:#1d3557}
.binlbl{font:800 11px Arial,sans-serif;fill:#e9ffe9;letter-spacing:.5px}
.swish{font:800 26px 'Baloo 2',sans-serif;fill:#ffd23f;stroke:#7a2a00;stroke-width:1;paint-order:stroke}
.bt{font:800 19px 'Baloo 2',sans-serif;fill:#2b1230}
#net{transform-box:fill-box;transform-origin:50% 0}
#net.sw{animation:net .5s ease-out}
#bin{transform-box:fill-box;transform-origin:50% 100%}
#bin.wob{animation:wob .5s ease-out}
#bubble{transform-box:fill-box;transform-origin:30% 100%}
#bubble.pop{animation:bpop .25s cubic-bezier(.3,1.6,.5,1)}
@keyframes net{30%{transform:scaleY(1.35) scaleX(.9)}70%{transform:scaleY(.92)}}
@keyframes wob{25%{transform:rotate(-5deg)}50%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}
@keyframes bpop{from{transform:scale(.6)}to{transform:scale(1)}}

.stamp{position:fixed;left:50%;top:9%;z-index:5;pointer-events:none;font:800 25px 'Baloo 2',sans-serif;color:#ff3b3b;border:5px solid #ff3b3b;border-radius:10px;padding:2px 14px;background:#ffffffe8;white-space:nowrap;opacity:0;transform:translate(-50%,-50%) rotate(-7deg) scale(3)}
.stamp.on{animation:stamp .3s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{to{opacity:1;transform:translate(-50%,-50%) rotate(-7deg) scale(1)}}
.ctrl{background:#24123a;display:flex;flex-direction:column;gap:8px;padding:8px 16px 14px;pointer-events:none}
.ctrl>*{transition:opacity .4s}.ctrl:not(.on)>*{opacity:0}
.ctrl.on{pointer-events:auto}.ctrl.on>*{opacity:1}
.row{display:flex;gap:8px}
.btn{flex:1;border:0;cursor:pointer;font:800 17px 'Baloo 2',sans-serif;color:#3a1200;padding:10px;border-radius:14px;background:linear-gradient(180deg,#ffe07a,#ff9a2e);box-shadow:0 4px 0 #b4520f}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b4520f}
.btn.alt{background:#ffffff18;color:#ffd23f;box-shadow:none;border:2px solid #ffc94d88}
.sndbtn{display:none;align-self:center;border:2px dashed #ff4d8d;background:#ff4d8d22;color:#ffc2d6;font:700 15px 'Baloo 2',sans-serif;padding:4px 14px;border-radius:99px;cursor:pointer}
.ctrl .sndbtn.on{display:block;opacity:1}
.brand{font-size:12px;color:#cdb3e6;opacity:.75;text-align:center}
</style>
</head>

function noise(dur, {f1 = 3000, f2 = f1, q = 1.2, vol = .25, type = 'bandpass'} = {}){
  if (!AC) return;
  const n = AC.sampleRate * dur | 0, buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain(), t = AC.currentTime;

  s.connect(fl).connect(g).connect(AC.destination); s.start(t); s.stop(t + dur);
}
function thud(){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;

  noise(.15, {f1: 400, type: 'lowpass', vol: .3});
}

const VOICE_BYTES = (() => { const b = atob(VOICE_B64), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; })();

let voiceBufP = null, voiceSrc = null;
function decodeVoice(){
  if (voiceBufP || !AC) return voiceBufP;
  voiceBufP = new Promise((res, rej) => { const p = AC.decodeAudioData(VOICE_BYTES.buffer.slice(0), res, rej); if (p && p.then) p.then(res, rej); });

}
function stopVoice(){ try { voiceSrc && voiceSrc.stop(); } catch (e) {} voiceSrc = null; try { snd.pause(); } catch (e) {} }

function initSfx(){
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); } catch (e) {}
  // tiny silent blip: wakes up audio on iPhone
  try { const b = AC.createBuffer(1, 1, 22050), s = AC.createBufferSource(); s.buffer = b; s.connect(AC.destination); s.start(0); } catch (e) {}
  decodeVoice();
}
async function startVoice(){
  stopVoice();
  // 1st choice: Web Audio
  try {
    if (AC){
      if (AC.state !== 'running') await Promise.race([AC.resume(), sleep(300)]);
      const buf = await Promise.race([decodeVoice(), sleep(1500).then(() => null)]);
      if (buf && AC.state === 'running'){
        const src = AC.createBufferSource(), g = AC.createGain(); g.gain.value = 1;
        src.buffer = buf; src.connect(g).connect(AC.destination); src.start(); voiceSrc = src;
        return true;
      }
    }
  } catch (e) {}
  // 2nd choice: normal audio player
  try {
    snd.muted = false; snd.volume = 1; snd.currentTime = 0;
    const playing = new Promise(r => snd.addEventListener('playing', () => r(true), {once: true}));
    const p = snd.play(); const ok = p ? p.then(() => true, () => false) : Promise.resolve(true);
    return await Promise.race([Promise.all([ok, playing]).then(([a]) => a), ok.then(a => a ? new Promise(r => setTimeout(() => r(true), 300)) : false), sleep(900).then(() => false)]);
  } catch (e) { return false; }
}

const setBall = (x, y, r = 0) => $('ball').setAttribute('transform', `translate(${x} ${y}) rotate(${r})`);
const setPaper = (x, y, r, s) => $('paper').setAttribute('transform', `translate(${x} ${y}) rotate(${r}) scale(${s})`);
const angry = on => { $('bl').setAttribute('transform', on ? 'rotate(18 86 308)' : ''); $('br').setAttribute('transform', on ? 'rotate(-18 114 308)' : ''); };
function say(lines){
  $('b1').textContent = lines[0]; $('b2').textContent = lines[1];
  const g = $('bubble'); g.setAttribute('opacity', 1); g.classList.remove('pop'); void g.getBBox(); g.classList.add('pop');
}
let talkTimer = null;
function talk(on){
  clearInterval(talkTimer); const m = $('mouth');
  if (!on) return m.setAttribute('ry', 2);
  let open = false; talkTimer = setInterval(() => { open = !open; m.setAttribute('ry', open ? 4 + Math.random()*4 : 1.5); }, 105);
}
function wrap(str, n, max){
  const words = (str || '').split(/\s+/), out = []; let line = '';
  for (const w of words){ if ((line + ' ' + w).trim().length > n){ out.push(line.trim()); line = w; } else line += ' ' + w; if (out.length >= max) break; }
  if (out.length < max && line.trim()) out.push(line.trim());
  if (out.length === max && words.join(' ').length > out.join(' ').length) out[max-1] = out[max-1].slice(0, n - 1) + '…';
  return out;
}
function fillPaper(){
  $('pTicket').textContent = 'Ticket ' + ticket + '  ·  Diwali 2026';
  const b = $('pBody'); b.innerHTML = '';
  wrap(complaint, 27, 9).forEach((ln, i) => { const t = document.createElementNS('http://www.w3.org/2000/svg', 'tspan'); t.setAttribute('x', -82); t.setAttribute('dy', i ? 16 : 0); t.textContent = ln; b.appendChild(t); });
}
function resetScene(){
  stopVoice(); talk(false);
  ['ball','paper','bubble','swish'].forEach(id => $(id).setAttribute('opacity', 0));
  $('stamp').classList.remove('on'); $('ctrl').classList.remove('on'); $('sndbtn').classList.remove('on');
  setArm(-20); angry(false);
}

let run = 0;
async function runScene(){
  const id = ++run, alive = () => id === run;
  resetScene(); fillPaper();

  // start the voice, then run the timeline from that moment
  const soundOk = await startVoice();
  if (!alive()) return;
  const T0 = performance.now(), at = ms => sleep(Math.max(0, T0 + ms - performance.now()));
  const P = [200, 108], PS = .8;

  // 0.00 — line 1 starts: paper flies in, officer angry and talking
  angry(true); say(LINE1); talk(true);
  $('paper').setAttribute('opacity', 1);
  tween(350, t => setPaper(P[0], lerp(-150, P[1], t), lerp(-14, -3, t), lerp(.5, PS, t)), easeOut);
  tween(380, t => setArm(lerp(-20, -60, t)), easeIO);

  // 0.95 — crumple it
  await at(950); if (!alive()) return;
  crinkle();
  const [hx, hy] = hand(-60), pi = $('paperInner');
  await tween(650, t => {
    const e = easeIn(t);
    setPaper(lerp(P[0], hx, e), lerp(P[1], hy, e), -3 + Math.sin(t * 40) * 12 * t, lerp(PS, .09, e));
    pi.setAttribute('transform', `skewX(${Math.sin(t*33)*14*t}) skewY(${Math.cos(t*27)*10*t}) scale(${1 - .25*Math.abs(Math.sin(t*20))*t},1)`);
    if (t > .7){ $('paper').setAttribute('opacity', (1 - t) / .3); $('ball').setAttribute('opacity', 1); setBall(hx, hy, t * 90); }
  });
  pi.removeAttribute('transform'); $('paper').setAttribute('opacity', 0);
  $('ball').setAttribute('opacity', 1); setBall(hx, hy);

  // 1.90 — pause in the audio: wind up
  await at(T.line1End); if (!alive()) return;
  talk(false);
  await tween(240, t => { const a = lerp(-60, -28, t); setArm(a); setBall(...hand(a)); }, easeIO);

  // 2.15 — line 2: SHOOT
  await at(T.line2); if (!alive()) return;
  say(LINE2); talk(true);
  await tween(170, t => { const a = lerp(-28, -165, t); setArm(a); setBall(...hand(a), t * 120); }, easeIn);
  const [rx, ry] = hand(-165), tg = [320, 251], c = [255, 40];
  tween(600, t => setArm(lerp(-165, -20, t)), easeIO);
  await tween(760, t => setBall((1-t)*(1-t)*rx + 2*(1-t)*t*c[0] + t*t*tg[0], (1-t)*(1-t)*ry + 2*(1-t)*t*c[1] + t*t*tg[1], 120 + t * 720));
  if (!alive()) return;

  // ~3.10 — swish, into the bin
  swishSfx(); const net = $('net'); net.classList.remove('sw'); void net.getBBox(); net.classList.add('sw');
  $('swish').setAttribute('opacity', 1);
  await tween(320, t => setBall(320, lerp(251, 505, t), 840 + t * 200), easeIn);
  thud(); const bin = $('bin'); bin.classList.remove('wob'); void bin.getBBox(); bin.classList.add('wob');
  $('ball').setAttribute('opacity', 0);
  $('stamp').classList.add('on');
  for (let i = 0; i < 14; i++) setTimeout(launch, i * 160);

  // 4.27 — line 2 ends
  await at(T.line2End); if (!alive()) return;
  talk(false); $('swish').setAttribute('opacity', 0);
  await at(4800); if (!alive()) return;
  $('ctrl').classList.add('on');
  if (!soundOk) $('sndbtn').classList.add('on');
}

$('sndbtn').onclick = $('replay').onclick = () => { initSfx(); runScene(); };
$('again').onclick = () => {
  run++; resetScene();
  document.body.className = 'plain';
  $('scene').classList.remove('on'); $('form').classList.add('on');
  $('iText').value = ''; window.scrollTo(0, 0);
};

/* ---------- fireworks (the irony) ---------- */
const cv = $('fx'), cx = cv.getContext('2d'); let W, H, DPR, parts = [], rockets = [];
const COLS = ['#ffc94d','#ff8a1f','#ff4d8d','#7cf0ff','#b388ff','#7dff8a','#ffffff','#ff6b3d'];
function resize(){ DPR = Math.min(2, devicePixelRatio || 1); W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR; }
addEventListener('resize', resize); resize();
function launch(){ rockets.push({x: W*(.1 + Math.random()*.8), y: H, vy: -H*(.012 + Math.random()*.005), ty: H*(.08 + Math.random()*.3), c: COLS[Math.random()*COLS.length|0]}); }
function burst(x, y, c){
  const n = 55 + Math.random()*40|0, c2 = COLS[Math.random()*COLS.length|0];
  for (let i = 0; i < n; i++){ const a = Math.PI*2*i/n + Math.random()*.2, s = (1.5 + Math.random()*3.3) * DPR;
    parts.push({x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, dec: .011 + Math.random()*.012, c: i % 2 ? c : c2}); }
}
(function loop(){
  cx.globalCompositeOperation = 'destination-out'; cx.fillStyle = 'rgba(0,0,0,.22)'; cx.fillRect(0, 0, W, H);
  cx.globalCompositeOperation = 'lighter';
  for (let i = rockets.length - 1; i >= 0; i--){ const r = rockets[i]; r.y += r.vy; cx.fillStyle = '#ffe9b0'; cx.beginPath(); cx.arc(r.x, r.y, 2*DPR, 0, 7); cx.fill(); if (r.y <= r.ty){ burst(r.x, r.y, r.c); rockets.splice(i, 1); } }
  for (let i = parts.length - 1; i >= 0; i--){ const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vx *= .985; p.vy = p.vy*.985 + .045*DPR; p.life -= p.dec;
    if (p.life <= 0){ parts.splice(i, 1); continue; } cx.globalAlpha = p.life; cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, 1.9*DPR, 0, 7); cx.fill(); }
  cx.globalAlpha = 1; requestAnimationFrame(loop);
})();
setInterval(() => { if (document.body.classList.contains('party') && Math.random() < .5) launch(); }, 1300);
</script>
